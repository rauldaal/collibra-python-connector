[project]
name = "collibra-connector"
version = "1.5.0.post1"
authors = [
  { name="Raul Dalgamonni", email="rauldalgamonnialonso@gmail.com"},
]
description = "An UNOFFICIAL standard Python connector for the Collibra Data Governance Center API with full type safety, async support, and enterprise features."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Framework :: Pydantic :: 2",
    "Development Status :: 5 - Production/Stable",
]
keywords = [
    "collibra",
    "data-governance",
    "data-catalog",
    "api-client",
    "data-lineage",
    "metadata-management",
]
dependencies = [
    "requests>=2.20.0"
]



[project.urls]
Homepage = "https://github.com/rauldaal/collibra-python-connector"
"Bug Tracker" = "https://github.com/rauldaal/collibra-python-connector/issues"
Documentation = "https://github.com/rauldaal/collibra-python-connector#readme"
Changelog = "https://github.com/rauldaal/collibra-python-connector/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "collibra_connector",
    "collibra_connector.api",
    "collibra_connector.apiv2",
    "collibra_connector.query_builder"
]

[tool.setuptools.package-data]
collibra_connector = ["py.typed"]



